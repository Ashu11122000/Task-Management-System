version: "3.9"

services:

  postgres:
    image: postgres:latest
    container_name: task_manager
    restart: always
    environment:
      POSTGRES_DB: task_manager
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: task123@
    ports:
      - "5432:5432"
    volumes:
      - task_manager_data:/var/lib/postgresql/data
      - ./src/database/init.sql:/docker-entrypoint-initdb.d/01-init.sql
      - ./src/database/indexes.sql:/docker-entrypoint-initdb.d/02-indexes.sql
    networks:
      - task-network

  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin-contai
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@taskmanager.com
      PGADMIN_DEFAULT_PASSWORD: admin123
    ports:
      - "5050:80"
    depends_on:
      - postgres
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - task-network

  app:
    build: .
    container_name: task-manager-api
    restart: always
    depends_on:
      - postgres
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      PGHOST: postgres
      PGUSER: postgres
      PGPORT: 5432
      PGDATABASE: task_manager
      PGPASSWORD: task123@
      JWT_SECRET: taskmanagersecret
      JWT_EXPIRES_IN: 30d
    volumes:
      - .:/app
    command: npx nodemon src/server.js
    networks:
      - task-network


volumes:
  task_manager_data:
  pgadmin_data:

networks:
  task-network: